name: CodexStock regression
on: [push, pull_request]
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: python -m pip install -U pip pytest ".[storage,reports,realtime]"
      - run: python -m compileall -q app packages examples
      - run: python -m pytest -q
        env:
          CODEXSTOCK_ALLOW_TEST_IMPORT: "1"
